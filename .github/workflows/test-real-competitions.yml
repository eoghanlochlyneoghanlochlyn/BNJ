name: Test Real FotMob Competitions

on:
  workflow_dispatch:

jobs:
  inspect-real-competitions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Inspect real FotMob competition structures
        run: |
          python test_real_competitions.py
