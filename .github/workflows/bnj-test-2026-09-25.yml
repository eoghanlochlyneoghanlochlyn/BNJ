name: BNJ Test - 2026-09-25

on:
  push:
    paths:
      - ".github/workflows/bnj-test-2026-09-25.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate and send September 25 fixtures
        env:
          TELEGRAMBOT: ${{ secrets.TELEGRAMBOT }}
          TELEGRAMCHANNEL: ${{ secrets.TELEGRAMCHANNEL }}
        run: python main.py --date 2026-09-25 --send-telegram
