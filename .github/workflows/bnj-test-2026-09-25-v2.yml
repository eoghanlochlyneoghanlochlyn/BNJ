name: BNJ Test - 2026-09-25 v2

permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/bnj-test-2026-09-25-v2.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate and send September 25 fixtures
        env:
          TELEGRAMBOT: ${{ secrets.TELEGRAMBOT }}
          TELEGRAMCHANNEL: ${{ secrets.TELEGRAMCHANNEL }}
        run: python main.py --date 2026-09-25 --send-telegram
      - name: Commit report state
        run: |
          if git diff --quiet -- report_state.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report_state.json
          git commit -m "Persist September 25 test state"
          git push
