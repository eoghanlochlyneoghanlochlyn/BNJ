name: BNJ Standings Test

on:
  workflow_dispatch:
    inputs:
      competition_id:
        description: "FotMob competition IDs (comma-separated)"
        required: false
        default: "50,77,290,44"
        type: string
      season:
        description: "Optional FotMob season, e.g. 2026/2027"
        required: false
        default: ""
        type: string
permissions:
  contents: read

jobs:
  standings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install -r requirements.txt

      - name: Fetch and render standings
        env:
          TELEGRAMBOT: ${{ secrets.TELEGRAMBOT }}
          TELEGRAMCHANNEL: ${{ secrets.TELEGRAMCHANNEL }}
        run: |
          IFS=',' read -ra IDS <<< "${{ inputs.competition_id }}"
          rm -rf output/standings
          mkdir -p output/standings
          for ID in "${IDS[@]}"; do
            ID="${ID//[[:space:]]/}"
            python - "$ID" "${{ inputs.season }}" <<'PY'
          import datetime as dt
          import sys
          from pathlib import Path
          from standings import all_groups_complete, fetch_standings, is_grouped_standings
          from standings_renderer import render_group_standings, render_standings
          competition_id = sys.argv[1]
          season = sys.argv[2] or None
          day = dt.datetime.now(dt.timezone.utc).date()
          data = fetch_standings(competition_id, season)
          output_dir = Path("output/standings") / competition_id
          output_dir.mkdir(parents=True, exist_ok=True)

          if is_grouped_standings(data):
              for index, table in enumerate(data["tables"], start=1):
                  group = str(table.get("group") or f"Group {index}")
                  safe_group = "".join(ch if ch.isalnum() else "_" for ch in group).strip("_")
                  render_group_standings(
                      data,
                      table,
                      day,
                      output_dir / f"{competition_id}_{index}_{safe_group}.png",
                  )

              if all_groups_complete(data):
                  render_standings(
                      data,
                      day,
                      output_dir / f"{competition_id}_ALL_GROUPS_FINAL.png",
                  )
                  print(f"[STANDINGS] {competition_id}: all groups complete -> final combined poster")
              else:
                  print(f"[STANDINGS] {competition_id}: group stage not complete -> no final combined poster")
          else:
              render_standings(
                  data,
                  day,
                  output_dir / f"{competition_id}.png",
              )
          PY
          done

      - name: Run standings unit tests
        run: python -m unittest test_standings_poster.py -v

      - name: Validate generated image
        run: |
          for image_path in output/standings/*.png; do
            test -s "$image_path"
            python - "$image_path" <<'PY'
          from PIL import Image
          import sys
          image = Image.open(sys.argv[1]).convert("RGB")
          if image.size[0] != 1600:
              raise SystemExit(f"Unexpected width: {image.size}")
          if len(set(image.getdata())) <= 1:
              raise SystemExit("Generated standings image is blank.")
          print("Valid standings image:", image.size)
          PY
          done

      - name: Send to Telegram
        env:
          TELEGRAMBOT: ${{ secrets.TELEGRAMBOT }}
          TELEGRAMCHANNEL: ${{ secrets.TELEGRAMCHANNEL }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from telegram import send_photo
          for path in sorted(Path("output/standings").rglob("*.png")):
              send_photo(path, "📊 جدول رقابت")
          PY
