name: BNJ Football Reports

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Iran date YYYY-MM-DD (optional)"
        required: false
        type: string
      send_telegram:
        description: "Send the generated image to Telegram"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "30 5 * * *"

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and publish today's fixtures
        env:
          TELEGRAMBOT: ${{ secrets.TELEGRAMBOT }}
          TELEGRAMCHANNEL: ${{ secrets.TELEGRAMCHANNEL }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python main.py --date "${{ inputs.date }}" --send-telegram
          else
            python main.py --send-telegram
          fi
      - name: Commit report state
        run: |
          if git diff --quiet -- report_state.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report_state.json
          git commit -m "Persist sent report state"
          git push
