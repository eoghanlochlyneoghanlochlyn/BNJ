name: BNJ Football Reports

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Iran date YYYY-MM-DD (optional)"
        required: false
        type: string
  schedule:
    - cron: "30 5 * * *"

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate today's fixtures
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python main.py --date "${{ inputs.date }}"
          else
            python main.py
          fi
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: bnj-fixtures
          path: output/fixtures.png
