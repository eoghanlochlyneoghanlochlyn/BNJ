name: BNJ Football Reports

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "Iran date YYYY-MM-DD (optional)"
        required: false
        type: string
      send_telegram:
        description: "Send the generated image to Telegram"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "30 5 * * *"

concurrency:
  group: bnj-football-reports
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and publish today's fixtures
        env:
          TELEGRAMBOT: ${{ secrets.TELEGRAMBOT }}
          TELEGRAMCHANNEL: ${{ secrets.TELEGRAMCHANNEL }}
          SEND_TELEGRAM: ${{ inputs.send_telegram || 'true' }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            if [ "$SEND_TELEGRAM" = "true" ]; then
              python main.py --date "${{ inputs.date }}" --send-telegram
            else
              python main.py --date "${{ inputs.date }}"
            fi
          else
            if [ "$SEND_TELEGRAM" = "true" ]; then
              python main.py --send-telegram
            else
              python main.py
            fi
          fi

      - name: Validate generated image
        run: |
          test -s output/fixtures.png
          python - <<'PY'
          from PIL import Image
          image = Image.open("output/fixtures.png").convert("RGB")
          pixels = image.getdata()
          non_white = sum(pixel != (255, 255, 255) for pixel in pixels)
          print(f"Image size: {image.size}")
          print(f"Non-white pixels: {non_white}")
          if non_white == 0:
              raise SystemExit("Generated fixture image is completely white.")
          PY

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: bnj-fixtures-preview
          path: output/fixtures.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit report state
        if: ${{ inputs.send_telegram != false }}
        run: |
          if git diff --quiet -- report_state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report_state.json
          git commit -m "Persist sent report state"

          git pull --rebase origin main
          git push
