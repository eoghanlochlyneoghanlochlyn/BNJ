name: BNJ Renderer Validation

on:
  push:
    paths:
      - ".github/workflows/bnj-renderer-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Render without Telegram
        run: python main.py --date 2026-09-26
      - name: Validate image
        run: |
          test -s output/fixtures.png
          python - <<'PY'
          from PIL import Image
          image = Image.open("output/fixtures.png").convert("RGB")
          non_white = sum(pixel != (255, 255, 255) for pixel in image.getdata())
          print("SIZE", image.size)
          print("NON_WHITE", non_white)
          if non_white == 0:
              raise SystemExit("Image is completely white")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bnj-renderer-validation
          path: output/fixtures.png
          if-no-files-found: error
